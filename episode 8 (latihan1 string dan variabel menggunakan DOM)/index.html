<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row text-center">
        <h1>Latihan 1-JavaScript data</h1>
      </div>
      <div class="row justify-content-center mt-3">
        <div class="col-4">
          <div class="input-grup">
            <input
              type="text"
              class="form-control"
              id="nama_depan"
              placeholder="Nama Depan"
              arial-placeholder="Nama Depan"
            />
          </div>
        </div>
        <div class="col-4">
          <div class="input-grup">
            <input
              type="text"
              class="form-control"
              id="nama_belakang"
              placeholder="Nama belakang"
              arial-placeholder="Nama belakang"
            />
          </div>
        </div>

        <div class="row justify-content-center mt-4">
          <button
            type="button "
            class="btn btn-primary col-2"
            id="button_merge"
          >
            Simpan
          </button>
        </div>
      </div>
      <div class="row text-center mt-4">
        <spam id="nama_lengkap"> Nama Lengkap</spam>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"

    ></script>
